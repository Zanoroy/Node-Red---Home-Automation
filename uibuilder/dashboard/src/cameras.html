<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: https: http:; connect-src 'self' https: http: ws: wss:; img-src 'self' data: blob: https: http:; media-src 'self' data: blob: https: http:; font-src 'self' data: https: http:; style-src 'self' 'unsafe-inline' data: blob: https: http:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https: http:; worker-src 'self' blob: https: http:; frame-src 'self' https: http:;">
    <link rel="icon" href="data:,">
    <title>Camera Dashboard</title>

    <script src="./uibuilder.iife.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="./cameras.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <header class="dashboard-header">
            <h1 class="dashboard-title">
                <i class="fas fa-home"></i>
                Home Automation Dashboard
            </h1>
            <div class="header-actions">
                <a class="header-nav-button" href="./index.html">
                    <i class="fas fa-table-columns"></i>
                    <span>Dashboard</span>
                </a>
                <div class="connection-status">
                    <span id="connectionStatus" class="status-indicator online">
                        <i class="fas fa-circle"></i> Connected to MediaMTX
                    </span>
                    <span id="lastUpdate" class="last-update">--:--</span>
                </div>
            </div>
        </header>

        <main class="dashboard-main camera-layout">
            <section class="widget-card camera-list-panel">
                <h2 class="widget-title">
                    <i class="fas fa-video"></i>
                    Cameras
                </h2>
                <div id="cameraGrid" class="camera-grid" aria-live="polite"></div>
            </section>

            <section class="widget-card camera-player-panel">
                <div class="camera-player-toolbar">
                    <h2 class="widget-title" style="margin-bottom: 0;">
                        <i class="fas fa-play-circle"></i>
                        Live View
                    </h2>
                    <div class="camera-toolbar-actions">
                        <button id="qualityToggle" class="stream-toggle quality-toggle" type="button">
                            <i class="fas fa-sliders"></i> Quality: Low
                        </button>
                        <button id="streamToggle" class="stream-toggle" type="button">
                            <i class="fas fa-pause"></i> Pause
                        </button>
                    </div>
                </div>

                <div class="camera-player-shell">
                    <video id="cameraPlayer" playsinline preload="auto" controls></video>
                    <div id="cameraEmptyState" class="camera-empty-state">
                        <div>
                            <i class="fas fa-video"></i>
                            Select a camera to begin streaming
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="./cameras.js"></script>
</body>
</html>
