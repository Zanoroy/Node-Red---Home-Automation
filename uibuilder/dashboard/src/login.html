<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home Automation Login</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/dashboardStyles.css" />
    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body class="loginPage">
    <main class="loginCard">
          <section class="loginShell dashboardShell">
            <header class="loginHeader">
              <h1>Dashboard Login</h1>
              <p>Banksia Park</p>
            </header>
            <form id="loginForm" novalidate>
              <div class="loginField">
                <label for="usernameInput" class="form-label">Username</label>
                <input id="usernameInput" name="username" class="form-control" autocomplete="username" required />
              </div>
              <div class="loginField">
                <label for="passwordInput" class="form-label">Password</label>
                <input id="passwordInput" name="password" type="password" class="form-control" autocomplete="current-password" required />
              </div>
              <div class="form-check loginRemember">
                <input id="rememberDevice" name="remember" class="form-check-input" type="checkbox" />
                <label class="form-check-label" for="rememberDevice">Remember this device</label>
              </div>
              <div id="loginError" class="alert alert-danger d-none py-2" role="alert"></div>
              <button id="loginSubmit" type="submit" class="btn btn-primary loginSubmit">Sign in</button>
            </form>
          </section>
    </main>
    <script src="./js/login.js"></script>
  </body>
</html>
